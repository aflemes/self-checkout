<div class="help">
  <div class="help__header">
    <span class="help__title">Help</span>
    <button class="help__close" aria-label="Close help" (click)="support.close()">✕</button>
  </div>

  <div class="help__body">
    @for (message of support.messages(); track $index) {
      <div class="bubble" [class.bubble--user]="message.from === 'user'">
        {{ message.text }}
      </div>
    }
    @if (support.typing()) {
      <div class="bubble bubble--bot typing">typing…</div>
    }
  </div>

  <div class="help__topics">
    <button class="app-button app-button--secondary" (click)="support.send('order')">
      I can't submit my order
    </button>
    <button class="app-button app-button--secondary" (click)="support.send('payment')">
      I need help with payment
    </button>
    <button class="app-button app-button--secondary" (click)="support.send('other')">
      Something else
    </button>
  </div>
</div>
