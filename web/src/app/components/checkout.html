    <div class="overlay" (click)="cancel()">
      <div class="dialog app-card" (click)="$event.stopPropagation()">
        <button class="dialog__close" aria-label="Close" (click)="cancel()">✕</button>

        <h2 class="dialog__title">Confirm order</h2>

        <div class="dialog__lines">
          @for (line of payableLines(); track line.productId) {
            <div class="dialog__line">
              <span class="dialog__qty">{{ line.quantity }}×</span>
              <span class="dialog__name">{{ line.product?.name }}</span>
              <span class="dialog__amount amount">
                {{ formatBRL(unitCents(line.product) * line.quantity) }}
              </span>
            </div>
          }
        </div>

        <div class="dialog__total">
          <span>Total</span>
          <span class="amount">{{ formatBRL(cart.totalCents()) }}</span>
        </div>

        <div class="pay-methods">
          <button
            class="pay-method"
            [class.pay-method--active]="method() === 'CARD'"
            (click)="method.set('CARD')"
          >
            <span class="pay-method__icon">💳</span>
            <span>Card</span>
          </button>
          <button
            class="pay-method"
            [class.pay-method--active]="method() === 'PIX'"
            (click)="method.set('PIX')"
          >
            <span class="pay-method__icon">⚡</span>
            <span>Pix</span>
          </button>
        </div>

        @if (error()) {
          <div class="banner banner--error">{{ error() }}</div>
        }

        <div class="dialog__actions">
          <button class="app-button app-button--secondary" [disabled]="submitting()" (click)="cancel()">
            Back
          </button>
          <button
            class="app-button app-button--primary confirm"
            [disabled]="submitting() || payableLines().length === 0"
            (click)="submit()"
          >
            @if (submitting()) {
              <span class="spinner"></span>
              <span>Processing…</span>
            } @else {
              <span>Confirm order</span>
            }
          </button>
        </div>
      </div>
    </div>
